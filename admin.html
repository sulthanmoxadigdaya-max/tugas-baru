<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        body {
            padding: 10px;
        }

        header {
            background: linear-gradient(135deg, #312e81, #1e1b4b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        header h1 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .btn-logout {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            header h1 { font-size: 1.2rem; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 10px;
            width: 100%;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .upload-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="file"] {
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100%;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background: #64748b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .stat-box p {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .product-list-admin {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
        }

        .product-item-admin img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .product-item-admin .info {
            flex: 1;
            min-width: 0;
        }

        .product-item-admin .info h4 {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-item-admin .info p {
            font-size: 0.75rem;
            color: #10b981;
            font-weight: bold;
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }

        .btn-edit, .btn-delete {
            border: none;
            padding: 4px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
        }

        .btn-edit { background: #f59e0b; }
        .btn-delete { background: #ef4444; }

        /* TABEL PENGIRIMAN CUSTOMER */
        .order-table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .order-table th, .order-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.75rem;
            vertical-align: top;
        }

        .order-table th {
            color: var(--accent);
            background: #0f172a;
        }

        .user-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .user-name {
            font-weight: bold;
            color: #f8fafc;
            font-size: 0.8rem;
        }

        .user-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .badge-gift {
            display: inline-block;
            background: #ec4899;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 4px;
            margin-top: 2px;
            width: fit-content;
        }

        .status-select {
            padding: 4px;
            border-radius: 4px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid var(--primary);
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ GadgetStore <span class="admin-badge">Admin</span></h1>
        <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="container">
        
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk Baru</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input type="text" id="nama" placeholder="Contoh: iPad Pro M2" required>
                </div>
                
                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input type="number" id="harga" placeholder="15000000" required>
                </div>
                
                <div class="form-group">
                    <label for="deskripsi">Deskripsi Singkat</label>
                    <textarea id="deskripsi" rows="2" placeholder="Spesifikasi & Detail" required></textarea>
                </div>
                
                <!-- Upload Gambar -->
                <div class="form-group">
                    <label>Gambar Produk (URL atau File Local)</label>
                    <div class="upload-options">
                        <input type="text" id="gambarUrl" placeholder="Link/URL Gambar">
                        <input type="file" id="gambarFile" accept="image/*" onchange="convertFileToBase64('gambarFile', 'gambarUrl')">
                    </div>
                </div>

                <!-- Upload Video Demo -->
                <div class="form-group">
                    <label>Video Demo Produk (URL YouTube/Embed atau File Local)</label>
                    <div class="upload-options">
                        <input type="text" id="ytVideoUrl" placeholder="Link YouTube / Embed">
                        <input type="file" id="ytVideoFile" accept="video/*" onchange="convertFileToBase64('ytVideoFile', 'ytVideoUrl')">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Simpan Produk</button>
                <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>

        <!-- Analytics & Inventaris -->
        <div class="card">
            <h2>📊 Analytics & Inventaris</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <p>Total Produk</p>
                    <h3 id="totalProductsCount">0</h3>
                </div>
                <div class="stat-box">
                    <p>Total Pesanan</p>
                    <h3 id="totalOrdersCount" style="color: #ec4899;">0</h3>
                </div>
            </div>

            <h2>📦 Daftar Produk Aktif</h2>
            <div class="product-list-admin" id="productListAdmin"></div>
        </div>

        <!-- Tabel Kelola Pengiriman (Tampilan Pemesan & Penerima) -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>🚚 Kelola Pengiriman Customer</h2>
            <div class="order-table-wrapper">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>ID Pesanan</th>
                            <th>Pemesan (Pembayar)</th>
                            <th>Penerima Paket</th>
                            <th>Alamat & Kontak Penerima</th>
                            <th>Item Barang</th>
                            <th>Pembayaran</th>
                            <th>Total</th>
                            <th>Status Pengiriman</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Konversi File Lokal ke Base64 (Gambar / Video)
        function convertFileToBase64(fileInputId, targetUrlInputId) {
            const fileInput = document.getElementById(fileInputId);
            const targetInput = document.getElementById(targetUrlInputId);
            
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                if (file.size > 3 * 1024 * 1024) {
                    alert('Ukuran file terlalu besar! Maksimal disarankan ~3MB agar LocalStorage tidak penuh.');
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    targetInput.value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function formatYouTubeEmbedUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:')) return url;

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}`;
            }
            return url;
        }

        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [
            {
                id: 1,
                nama: "Smartphone Premium X",
                harga: 12000000,
                deskripsi: "Layar AMOLED 120Hz, RAM 12GB, Chipset Octa-Core.",
                gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
                ytVideo: "https://www.youtube.com/embed/L_LUpnjgPso"
            }
        ];

        // Sample Data Pesanan dengan Skenario Pemesan A Kirim ke Penerima B
        let orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [
            {
                id: "ORD-9901",
                buyerName: "Andi Saputra",               // Pembeli (A)
                buyerEmail: "andi.saputra@email.com",
                recipientName: "Budi Santoso",            // Penerima (B)
                recipientPhone: "0812-3456-7890",
                recipientAddress: "Jl. Pemuda No. 45, Semarang, Jawa Tengah",
                date: "2026-08-12",
                items: [{ nama: "Smartphone Premium X", qty: 1 }],
                paymentMethod: "QRIS / E-Wallet",
                total: 12000000,
                status: "Sedang Diproses"
            }
        ];

        function renderAdminProducts() {
            const container = document.getElementById('productListAdmin');
            const countElem = document.getElementById('totalProductsCount');
            container.innerHTML = '';
            countElem.innerText = products.length;

            products.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'product-item-admin';
                item.innerHTML = `
                    <img src="${p.gambar}" alt="${p.nama}">
                    <div class="info">
                        <h4>${p.nama}</h4>
                        <p>Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">Hapus</button>
                    </div>
                `;
                container.appendChild(item);
            });

            try {
                localStorage.setItem('gadgetProducts', JSON.stringify(products));
            } catch (e) {
                alert('Peringatan: Ukuran file lokal melebihi kapasitas LocalStorage!');
            }
        }

        function renderAdminOrders() {
            const tbody = document.getElementById('adminOrdersBody');
            const orderCountElem = document.getElementById('totalOrdersCount');
            tbody.innerHTML = '';
            orderCountElem.innerText = orders.length;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#94a3b8;">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                const itemsSummary = ord.items.map(i => `${i.nama} (${i.qty}x)`).join(', ');
                
                // Deteksi jika Pemesan (A) beda dengan Penerima (B)
                const isGiftOrDropship = ord.recipientName && (ord.buyerName !== ord.recipientName);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${ord.id}</strong><br><span class="user-sub">${ord.date}</span></td>
                    <td>
                        <div class="user-box">
                            <span class="user-name">👤 ${ord.buyerName || 'Tanpa Nama'}</span>
                            <span class="user-sub">📧 ${ord.buyerEmail || '-'}</span>
                        </div>
                    </td>
                    <td>
                        <div class="user-box">
                            <span class="user-name" style="color: #38bdf8;">📦 ${ord.recipientName || ord.buyerName || '-'}</span>
                            ${isGiftOrDropship ? '<span class="badge-gift">🎁 Kirim Hadiah / Dropship</span>' : ''}
                        </div>
                    </td>
                    <td>
                        <div class="user-box">
                            <span class="user-sub">📱 ${ord.recipientPhone || ord.buyerPhone || '-'}</span>
                            <span class="user-sub">📍 ${ord.recipientAddress || ord.buyerAddress || '-'}</span>
                        </div>
                    </td>
                    <td>${itemsSummary}</td>
                    <td><span class="user-sub" style="color:#06b6d4;">${ord.paymentMethod || 'Transfer/E-Wallet'}</span></td>
                    <td style="color:#10b981; font-weight:bold;">Rp ${Number(ord.total).toLocaleString('id-ID')}</td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Diproses</option>
                            <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Perjalanan</option>
                            <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sampai</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>🎉 Selesai</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateOrderStatus(index, newStatus) {
            orders[index].status = newStatus;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert(`Status pesanan #${orders[index].id} diperbarui menjadi: ${newStatus}`);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editProductId').value;
            let videoInput = document.getElementById('ytVideoUrl').value;
            videoInput = formatYouTubeEmbedUrl(videoInput);

            const productData = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById('nama').value,
                harga: Number(document.getElementById('harga').value),
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || 'https://via.placeholder.com/300',
                ytVideo: videoInput
            };

            if (editId) {
                const index = products.findIndex(p => p.id === Number(editId));
                if (index !== -1) {
                    products[index] = productData;
                    alert('Produk berhasil diperbarui!');
                }
            } else {
                products.push(productData);
                alert('Produk baru berhasil ditambahkan!');
            }

            renderAdminProducts();
            resetForm();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('editProductId').value = prod.id;
            document.getElementById('nama').value = prod.nama;
            document.getElementById('harga').value = prod.harga;
            document.getElementById('deskripsi').value = prod.deskripsi;
            document.getElementById('gambarUrl').value = prod.gambar;
            document.getElementById('ytVideoUrl').value = prod.ytVideo;

            document.getElementById('formTitle').innerText = '✏️ Edit Produk';
            document.getElementById('btnSubmit').innerText = 'Update Produk';
            document.getElementById('btnCancel').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('gambarFile').value = '';
            document.getElementById('ytVideoFile').value = '';
            document.getElementById('gambarUrl').value = '';
            document.getElementById('ytVideoUrl').value = '';
            document.getElementById('formTitle').innerText = '➕ Tambah Produk Baru';
            document.getElementById('btnSubmit').innerText = 'Simpan Produk';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(index) {
            if(confirm('Yakin ingin menghapus produk ini?')) {
                products.splice(index, 1);
                renderAdminProducts();
            }
        }

        renderAdminProducts();
        renderAdminOrders();
    </script>
</body>
</html>
