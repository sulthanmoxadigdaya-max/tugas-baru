<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GadgetStore</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #6366f1;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 12px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1b4b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            font-size: 0.8rem;
        }

        .btn-red { background: var(--danger); }
        .btn-blue { background: #3b82f6; }
        .btn-yellow { background: #f59e0b; }
        .btn-green { background: var(--success); }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background: var(--card);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card h2 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h3 { font-size: 1.2rem; color: var(--accent); }
        .stat-box p { font-size: 0.7rem; color: var(--text-sub); }

        .prod-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prod-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
        }

        .prod-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .prod-info { flex: 1; min-width: 0; }
        .prod-info h4 { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prod-info p { font-size: 0.75rem; color: var(--success); font-weight: bold; }

        .table-wrap {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            font-size: 0.75rem;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        th { color: var(--accent); background: #0f172a; }

        /* MODAL POPUP */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 99;
        }

        .modal-box {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            max-width: 450px;
            width: 100%;
        }

        .modal-box h3 {
            color: var(--accent);
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .modal-box p {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .modal-box strong { color: #fff; }
    </style>
</head>
<body>

    <header>
        <h2>⚡ Admin Panel</h2>
        <button class="btn btn-red" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="grid">
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk</h2>
            <form id="prodForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="nama" required placeholder="Contoh: iPad Air">
                </div>

                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" id="harga" required placeholder="8000000">
                </div>

                <div class="form-group">
                    <label>Opsi Pembayaran Default</label>
                    <select id="metodeBayar">
                        <option value="Transfer Bank">Transfer Bank / QRIS</option>
                        <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
                        <option value="E-Wallet (Dana/Ovo/Gopay)">E-Wallet (Dana/Ovo/Gopay)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="deskripsi" rows="2" required placeholder="Deskripsi produk..."></textarea>
                </div>

                <div class="form-group">
                    <label>Gambar Produk (URL / Upload File)</label>
                    <input type="text" id="gambarUrl" placeholder="Link Gambar" style="margin-bottom: 4px;">
                    <input type="file" accept="image/*" onchange="convertFile('gambarFile', 'gambarUrl')" id="gambarFile">
                </div>

                <div class="form-group">
                    <label>Video Demo (URL Youtube / Upload File)</label>
                    <input type="text" id="ytUrl" placeholder="Link YouTube" style="margin-bottom: 4px;">
                    <input type="file" accept="video/*" onchange="convertFile('ytFile', 'ytUrl')" id="ytFile">
                </div>

                <button type="submit" class="btn btn-green" id="btnSubmit" style="width:100%; margin-top:8px;">Simpan Produk</button>
                <button type="button" class="btn btn-red" id="btnCancel" onclick="resetForm()" style="width:100%; margin-top:4px; display:none;">Batal Edit</button>
            </form>
        </div>

        <!-- Dashboard Ringkasan & List Produk -->
        <div class="card">
            <h2>📊 Statistik & Inventaris</h2>
            <div class="stats-grid">
                <div class="stat-box"><p>Total Produk</p><h3 id="countProd">0</h3></div>
                <div class="stat-box"><p>Total Pesanan</p><h3 id="countOrd" style="color:#ec4899;">0</h3></div>
            </div>

            <h2>📦 Daftar Produk</h2>
            <div class="prod-list" id="prodList"></div>
        </div>

        <!-- Tabel Pesanan Customer -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>🚚 Kelola Pesanan Customer</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pembeli</th>
                            <th>Tanggal</th>
                            <th>Total</th>
                            <th>Metode Bayar</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="orderList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Pop-up Detail Pesanan -->
    <div class="modal" id="detailModal">
        <div class="modal-box">
            <h3>📋 Detail Pesanan</h3>
            <div id="modalBody"></div>
            <button class="btn btn-red" onclick="closeModal()" style="width:100%; margin-top:12px;">Tutup</button>
        </div>
    </div>

    <script>
        // Ambil Data dari LocalStorage
        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [];
        let orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

        // Convert File lokal ke Base64 (untuk Upload Gambar/Video)
        function convertFile(inputId, targetId) {
            const file = document.getElementById(inputId).files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById(targetId).value = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        // Render Daftar Produk Admin
        function renderProducts() {
            const container = document.getElementById('prodList');
            document.getElementById('countProd').innerText = products.length;
            container.innerHTML = products.length === 0 ? '<p style="color:#94a3b8; font-size:0.8rem;">Belum ada produk.</p>' : '';

            products.forEach((p, idx) => {
                container.innerHTML += `
                    <div class="prod-item">
                        <img src="${p.gambar || 'https://via.placeholder.com/40'}" alt="">
                        <div class="prod-info">
                            <h4>${p.nama}</h4>
                            <p>Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                        </div>
                        <button class="btn btn-yellow" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn btn-red" onclick="deleteProduct(${idx})">Hapus</button>
                    </div>
                `;
            });
            localStorage.setItem('gadgetProducts', JSON.stringify(products));
        }

        // Simpan / Edit Produk
        function saveProduct(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const data = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById('nama').value,
                harga: Number(document.getElementById('harga').value),
                metodeBayar: document.getElementById('metodeBayar').value,
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || 'https://via.placeholder.com/150',
                ytVideo: document.getElementById('ytUrl').value
            };

            if (editId) {
                const idx = products.findIndex(p => p.id === Number(editId));
                if (idx !== -1) products[idx] = data;
            } else {
                products.push(data);
            }

            renderProducts();
            resetForm();
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            document.getElementById('editId').value = p.id;
            document.getElementById('nama').value = p.nama;
            document.getElementById('harga').value = p.harga;
            document.getElementById('metodeBayar').value = p.metodeBayar || 'Transfer Bank';
            document.getElementById('deskripsi').value = p.deskripsi;
            document.getElementById('gambarUrl').value = p.gambar;
            document.getElementById('ytUrl').value = p.ytVideo || '';

            document.getElementById('formTitle').innerText = '✏️ Edit Produk';
            document.getElementById('btnSubmit').innerText = 'Update Produk';
            document.getElementById('btnCancel').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('prodForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').innerText = '➕ Tambah Produk';
            document.getElementById('btnSubmit').innerText = 'Simpan Produk';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(idx) {
            if (confirm('Hapus produk ini?')) {
                products.splice(idx, 1);
                renderProducts();
            }
        }

        // --- FUNGSI AMAN PENGAMBILAN DATA PEMBELI ---
        const getBuyerName = (o) => o.buyerName || o.namaPembeli || o.namaPenerima || o.pembeli || o.customerName || o.nama || o.name || 'Tanpa Nama';
        const getBuyerPhone = (o) => o.phone || o.telepon || o.noHp || o.hp || o.noTelp || o.whatsapp || o.wa || 'Tidak Ada Nomor HP';
        const getBuyerAddress = (o) => o.address || o.alamat || o.alamatLengkap || o.shippingAddress || o.lokasi || 'Alamat Tidak Diisi';

        // Render Daftar Pesanan
        function renderOrders() {
            orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];
            const tbody = document.getElementById('orderList');
            document.getElementById('countOrd').innerText = orders.length;
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${ord.id || (idx + 1)}</strong></td>
                        <td><strong style="color:#38bdf8;">${getBuyerName(ord)}</strong></td>
                        <td>${ord.date || ord.tanggal || '-'}</td>
                        <td style="color:#10b981; font-weight:bold;">Rp ${Number(ord.total || ord.totalHarga || 0).toLocaleString('id-ID')}</td>
                        <td>${ord.paymentMethod || ord.metodePembayaran || 'Transfer Bank'}</td>
                        <td>
                            <select onchange="updateStatus(${idx}, this.value)">
                                <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Diproses</option>
                                <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Perjalanan</option>
                                <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sampai</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-blue" onclick="showDetail(${idx})">Detail</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateStatus(idx, val) {
            orders[idx].status = val;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert('Status pesanan berhasil diperbarui!');
        }

        function showDetail(idx) {
            const ord = orders[idx];
            let itemsHtml = '';

            if (Array.isArray(ord.items) && ord.items.length > 0) {
                itemsHtml = ord.items.map(i => `<li>${i.nama || i.name || 'Produk'} - ${i.qty || 1}x (Rp ${Number(i.harga || i.price || 0).toLocaleString('id-ID')})</li>`).join('');
            } else {
                itemsHtml = `<li>${ord.productName || 'Produk'} - 1x</li>`;
            }

            document.getElementById('modalBody').innerHTML = `
                <p><strong>ID Pesanan:</strong> #${ord.id || (idx + 1)}</p>
                <p><strong>Nama Penerima:</strong> <span style="color:#38bdf8; font-weight:bold;">${getBuyerName(ord)}</span></p>
                <p><strong>No. HP / Telepon:</strong> ${getBuyerPhone(ord)}</p>
                <p><strong>Alamat Pengiriman:</strong> ${getBuyerAddress(ord)}</p>
                <p><strong>Tanggal:</strong> ${ord.date || ord.tanggal || '-'}</p>
                <p><strong>Metode Pembayaran:</strong> ${ord.paymentMethod || ord.metodePembayaran || 'Transfer Bank'}</p>
                <p><strong>Status:</strong> ${ord.status || 'Sedang Diproses'}</p>
                <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
                <p><strong>Item Dibeli:</strong></p>
                <ul style="padding-left:18px; font-size:0.8rem; margin-top:4px;">${itemsHtml}</ul>
                <p style="margin-top:10px;"><strong>Total:</strong> <span style="color:#10b981; font-weight:bold;">Rp ${Number(ord.total || ord.totalHarga || 0).toLocaleString('id-ID')}</span></p>
            `;

            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Event listener saat ada pesanan masuk dari pembeli di tab lain
        window.addEventListener('storage', (e) => {
            if (e.key === 'gadgetOrders') renderOrders();
        });

        // Inisialisasi awal
        renderProducts();
        renderOrders();
    </script>
</body>
</html>
