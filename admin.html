<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #312e81, #1e1b4b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.5rem;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-logout {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .btn-logout:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* Responsif HP */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.2rem;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .upload-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        @media (max-width: 500px) {
            .upload-options {
                grid-template-columns: 1fr;
            }
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background: #64748b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .stat-box h3 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-top: 4px;
        }

        .stat-box p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .product-list-admin {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-item-admin img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-item-admin .info {
            flex: 1;
        }

        .product-item-admin .info h4 {
            font-size: 0.9rem;
        }

        .product-item-admin .info p {
            font-size: 0.8rem;
            color: #10b981;
            font-weight: bold;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: #f59e0b;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Tabel Order Status Admin */
        .order-table-container {
            overflow-x: auto;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            min-width: 600px;
        }

        .order-table th, .order-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem;
        }

        .order-table th {
            color: var(--accent);
            background: #0f172a;
        }

        .status-select {
            padding: 6px;
            border-radius: 6px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid var(--primary);
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ GadgetStore Pro <span class="admin-badge">Admin System</span></h1>
        <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="container">
        
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk Baru</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input type="text" id="nama" placeholder="Contoh: iPad Pro M2" required>
                </div>
                
                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input type="number" id="harga" placeholder="15000000" required>
                </div>
                
                <div class="form-group">
                    <label for="deskripsi">Deskripsi & Spesifikasi Singkat</label>
                    <textarea id="deskripsi" rows="3" placeholder="Layar 120Hz, RAM 16GB, Chipset M2" required></textarea>
                </div>
                
                <!-- Upload Gambar -->
                <div class="form-group">
                    <label>Gambar Produk (URL / Upload File Internal)</label>
                    <div class="upload-options">
                        <input type="text" id="gambarUrl" placeholder="Masukkan Link/URL Gambar">
                        <input type="file" id="gambarFile" accept="image/*" onchange="convertFileToBase64('gambarFile', 'gambarUrl')">
                    </div>
                </div>

                <!-- Upload Video Demo -->
                <div class="form-group">
                    <label>Video Demo Produk (YouTube / Upload File Internal)</label>
                    <div class="upload-options">
                        <input type="text" id="ytVideoUrl" placeholder="URL YouTube / Embed">
                        <input type="file" id="ytVideoFile" accept="video/*" onchange="convertFileToBase64('ytVideoFile', 'ytVideoUrl')">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Simpan Produk ke Database</button>
                <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>

        <!-- Dashboard Analytics & Daftar Inventaris -->
        <div class="card">
            <h2>📊 Analytics & Inventaris Saat Ini</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <p>Total Produk</p>
                    <h3 id="totalProductsCount">0</h3>
                </div>
                <div class="stat-box">
                    <p>Total Pesanan Pembeli</p>
                    <h3 id="totalOrdersCount" style="color: #ec4899;">0</h3>
                </div>
            </div>

            <h2>📦 Daftar Produk Aktif</h2>
            <div class="product-list-admin" id="productListAdmin">
                <!-- Dynamic Items -->
            </div>
        </div>

        <!-- BAGIAN KELOLA PESANAN & STATUS PENGIRIMAN -->
        <div class="card full-width">
            <h2>🚚 Kelola Status Pengiriman Barang Customer</h2>
            <div class="order-table-container">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>ID Order</th>
                            <th>Pembeli</th>
                            <th>Tanggal</th>
                            <th>Detail Barang</th>
                            <th>Total Belanja</th>
                            <th>Status Pengiriman</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody">
                        <!-- Dynamic Orders -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Konversi File Lokal/Internal ke Base64 Data URL
        function convertFileToBase64(fileInputId, targetUrlInputId) {
            const fileInput = document.getElementById(fileInputId);
            const targetInput = document.getElementById(targetUrlInputId);
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    targetInput.value = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function formatYouTubeEmbedUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:video/')) return url; // File internal Base64

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}`;
            }
            return url;
        }

        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [
            {
                id: 1,
                nama: "Smartphone Premium X",
                harga: 12000000,
                deskripsi: "Layar AMOLED 120Hz, RAM 12GB, Chipset Octa-Core, Kamera 108MP.",
                gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
                ytVideo: "https://www.youtube.com/embed/L_LUpnjgPso"
            },
            {
                id: 2,
                nama: "Laptop Ultra Book Pro",
                harga: 18500000,
                deskripsi: "Layar 14 Retina 120Hz, RAM 16GB SSD 512GB, Baterai Tahan 18 Jam.",
                gambar: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",
                ytVideo: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        let orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

        function renderAdminProducts() {
            const container = document.getElementById('productListAdmin');
            const countElem = document.getElementById('totalProductsCount');
            container.innerHTML = '';
            countElem.innerText = products.length;

            products.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'product-item-admin';
                item.innerHTML = `
                    <img src="${p.gambar}" alt="${p.nama}">
                    <div class="info">
                        <h4>${p.nama}</h4>
                        <p>Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">Hapus</button>
                    </div>
                `;
                container.appendChild(item);
            });

            localStorage.setItem('gadgetProducts', JSON.stringify(products));
        }

        function renderAdminOrders() {
            const tbody = document.getElementById('adminOrdersBody');
            const orderCountElem = document.getElementById('totalOrdersCount');
            tbody.innerHTML = '';
            orderCountElem.innerText = orders.length;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Belum ada pesanan masuk dari pembeli.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                const itemsSummary = ord.items.map(i => `${i.nama} (${i.qty}x)`).join(', ');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${ord.id}</strong></td>
                    <td>${ord.buyerName}</td>
                    <td>${ord.date}</td>
                    <td>${itemsSummary}</td>
                    <td style="color:#10b981; font-weight:bold;">Rp ${Number(ord.total).toLocaleString('id-ID')}</td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Sedang Diproses</option>
                            <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Dalam Perjalanan</option>
                            <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sudah Sampai</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>🎉 Selesai</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateOrderStatus(index, newStatus) {
            orders[index].status = newStatus;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert(`Status pesanan #${orders[index].id} telah diubah menjadi: ${newStatus}`);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editProductId').value;
            let videoInput = document.getElementById('ytVideoUrl').value;
            videoInput = formatYouTubeEmbedUrl(videoInput);

            const productData = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById('nama').value,
                harga: Number(document.getElementById('harga').value),
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || 'https://via.placeholder.com/300',
                ytVideo: videoInput
            };

            if (editId) {
                // Modus Edit Produk
                const index = products.findIndex(p => p.id === Number(editId));
                if (index !== -1) {
                    products[index] = productData;
                    alert('Produk berhasil diperbarui!');
                }
            } else {
                // Modus Tambah Produk
                products.push(productData);
                alert('Produk baru berhasil ditambahkan!');
            }

            renderAdminProducts();
            resetForm();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('editProductId').value = prod.id;
            document.getElementById('nama').value = prod.nama;
            document.getElementById('harga').value = prod.harga;
            document.getElementById('deskripsi').value = prod.deskripsi;
            document.getElementById('gambarUrl').value = prod.gambar;
            document.getElementById('ytVideoUrl').value = prod.ytVideo;

            document.getElementById('formTitle').innerText = '✏️ Edit Produk';
            document.getElementById('btnSubmit').innerText = 'Update Produk';
            document.getElementById('btnCancel').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('gambarFile').value = '';
            document.getElementById('ytVideoFile').value = '';
            document.getElementById('formTitle').innerText = '➕ Tambah Produk Baru';
            document.getElementById('btnSubmit').innerText = 'Simpan Produk ke Database';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(index) {
            if(confirm('Yakin ingin menghapus produk ini?')) {
                products.splice(index, 1);
                renderAdminProducts();
            }
        }

        // Initialize
        renderAdminProducts();
        renderAdminOrders();
    </script>
</body>
</html>
