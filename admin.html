<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Viewport standar agar HP menyesuaikan layar otomatis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* RESET TOTAL AGAR ELEMEN TIDAK MELUBER KELUAR HP */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        body {
            padding: 10px;
        }

        /* HEADER RESPONSIVE */
        header {
            background: linear-gradient(135deg, #312e81, #1e1b4b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        header h1 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .btn-logout {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* CONTAINER GRID LAYOUT */
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            header h1 { font-size: 1.2rem; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 10px;
            width: 100%;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        /* MEMAKSA INPUT TIDAK MELEBIHI LEBAR LAYAR */
        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            max-width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
            display: block;
        }

        .upload-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        input[type="file"] {
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100%;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background: #64748b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .stat-box p {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .product-list-admin {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
        }

        .product-item-admin img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .product-item-admin .info {
            flex: 1;
            min-width: 0;
        }

        .product-item-admin .info h4 {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-item-admin .info p {
            font-size: 0.75rem;
            color: #10b981;
            font-weight: bold;
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }

        .btn-edit, .btn-delete, .btn-detail {
            border: none;
            padding: 4px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
        }

        .btn-edit { background: #f59e0b; }
        .btn-delete { background: #ef4444; }
        .btn-detail { background: #3b82f6; }

        /* TABEL SCROLL KHUSUS PERANGKAT HP */
        .order-table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .order-table th, .order-table td {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.75rem;
        }

        .order-table th {
            color: var(--accent);
            background: #0f172a;
        }

        .status-select {
            padding: 4px;
            border-radius: 4px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid var(--primary);
            font-size: 0.7rem;
        }

        .payment-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }

        /* MODAL POPUP UNTUK DETAIL PESANAN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: var(--accent);
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .modal-content p {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .modal-content strong {
            color: #fff;
        }

        .btn-close-modal {
            margin-top: 15px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ GadgetStore <span class="admin-badge">Admin</span></h1>
        <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="container">
        
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk Baru</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input type="text" id="nama" placeholder="Contoh: iPad Pro M2" required>
                </div>
                
                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input type="number" id="harga" placeholder="15000000" required>
                </div>

                <div class="form-group">
                    <label for="metodePembayaranDefault">Opsi Pembayaran Utama</label>
                    <select id="metodePembayaranDefault">
                        <option value="Transfer Bank">Transfer Bank / QRIS</option>
                        <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
                        <option value="E-Wallet (Gopay/OVO/Dana)">E-Wallet (Gopay/OVO/Dana)</option>
                        <option value="Kartu Kredit / Debit">Kartu Kredit / Debit</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="deskripsi">Deskripsi Singkat</label>
                    <textarea id="deskripsi" rows="2" placeholder="Spesifikasi & Detail" required></textarea>
                </div>
                
                <!-- Upload Gambar -->
                <div class="form-group">
                    <label>Gambar Produk</label>
                    <div class="upload-options">
                        <input type="text" id="gambarUrl" placeholder="Link/URL Gambar">
                        <input type="file" id="gambarFile" accept="image/*" onchange="convertFileToBase64('gambarFile', 'gambarUrl')">
                    </div>
                </div>

                <!-- Upload Video Demo -->
                <div class="form-group">
                    <label>Video Demo Produk</label>
                    <div class="upload-options">
                        <input type="text" id="ytVideoUrl" placeholder="Link YouTube / Embed">
                        <input type="file" id="ytVideoFile" accept="video/*" onchange="convertFileToBase64('ytVideoFile', 'ytVideoUrl')">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Simpan Produk</button>
                <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>

        <!-- Dashboard Analytics & Inventaris -->
        <div class="card">
            <h2>📊 Analytics & Inventaris</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <p>Total Produk</p>
                    <h3 id="totalProductsCount">0</h3>
                </div>
                <div class="stat-box">
                    <p>Total Pesanan</p>
                    <h3 id="totalOrdersCount" style="color: #ec4899;">0</h3>
                </div>
            </div>

            <h2>📦 Daftar Produk Aktif</h2>
            <div class="product-list-admin" id="productListAdmin"></div>
        </div>

        <!-- Kelola Status Pengiriman & Pembayaran -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>🚚 Kelola Pengiriman & Pembayaran Customer</h2>
            <div class="order-table-wrapper">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pembeli</th>
                            <th>Tanggal</th>
                            <th>Barang</th>
                            <th>Total</th>
                            <th>Metode Bayar</th>
                            <th>Status Pengiriman</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Detail Pesanan -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <h3>📋 Rincian Pesanan</h3>
            <div id="modalBody"></div>
            <button class="btn-close-modal" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        function convertFileToBase64(fileInputId, targetUrlInputId) {
            const fileInput = document.getElementById(fileInputId);
            const targetInput = document.getElementById(targetUrlInputId);
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    targetInput.value = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function formatYouTubeEmbedUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:video/')) return url;

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}`;
            }
            return url;
        }

        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [
            {
                id: 1,
                nama: "Smartphone Premium X",
                harga: 12000000,
                metodeBayar: "Transfer Bank",
                deskripsi: "Layar AMOLED 120Hz, RAM 12GB, Chipset Octa-Core, Kamera 108MP.",
                gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
                ytVideo: "https://www.youtube.com/embed/L_LUpnjgPso"
            },
            {
                id: 2,
                nama: "Laptop Ultra Book Pro",
                harga: 18500000,
                metodeBayar: "Transfer Bank",
                deskripsi: "Layar 14 Retina 120Hz, RAM 16GB SSD 512GB, Baterai Tahan 18 Jam.",
                gambar: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",
                ytVideo: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        let orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

        function renderAdminProducts() {
            const container = document.getElementById('productListAdmin');
            const countElem = document.getElementById('totalProductsCount');
            container.innerHTML = '';
            countElem.innerText = products.length;

            products.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'product-item-admin';
                item.innerHTML = `
                    <img src="${p.gambar}" alt="${p.nama}">
                    <div class="info">
                        <h4>${p.nama}</h4>
                        <p>Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">Hapus</button>
                    </div>
                `;
                container.appendChild(item);
            });

            localStorage.setItem('gadgetProducts', JSON.stringify(products));
        }

        function renderAdminOrders() {
            orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];
            const tbody = document.getElementById('adminOrdersBody');
            const orderCountElem = document.getElementById('totalOrdersCount');
            tbody.innerHTML = '';
            orderCountElem.innerText = orders.length;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#94a3b8;">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                const itemsSummary = ord.items.map(i => `${i.nama} (${i.qty || 1}x)`).join(', ');
                const paymentMethod = ord.paymentMethod || ord.metodePembayaran || 'Transfer Bank';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${ord.id}</strong></td>
                    <td>${ord.buyerName || 'Pembeli'}</td>
                    <td>${ord.date || '-'}</td>
                    <td>${itemsSummary}</td>
                    <td style="color:#10b981; font-weight:bold;">Rp ${Number(ord.total).toLocaleString('id-ID')}</td>
                    <td><span class="payment-badge">💳 ${paymentMethod}</span></td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Diproses</option>
                            <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Perjalanan</option>
                            <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sampai</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>🎉 Selesai</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-detail" onclick="showOrderDetail(${index})">Detail</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateOrderStatus(index, newStatus) {
            orders[index].status = newStatus;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert(`Status pesanan #${orders[index].id} diperbarui menjadi: ${newStatus}`);
        }

        function showOrderDetail(index) {
            const ord = orders[index];
            const modal = document.getElementById('orderModal');
            const body = document.getElementById('modalBody');

            const itemsListHtml = ord.items.map(i => `
                <li style="margin-bottom: 4px;">
                    <strong>${i.nama}</strong> - ${i.qty || 1} x Rp ${Number(i.harga).toLocaleString('id-ID')}
                </li>
            `).join('');

            body.innerHTML = `
                <p><strong>ID Pesanan:</strong> #${ord.id}</p>
                <p><strong>Nama Pembeli:</strong> ${ord.buyerName || '-'}</p>
                <p><strong>Tanggal:</strong> ${ord.date || '-'}</p>
                <p><strong>No. HP/Telepon:</strong> ${ord.phone || '-'}</p>
                <p><strong>Alamat Pengiriman:</strong> ${ord.address || '-'}</p>
                <p><strong>Metode Pembayaran:</strong> ${ord.paymentMethod || ord.metodePembayaran || 'Transfer Bank'}</p>
                <p><strong>Status Saat Ini:</strong> ${ord.status || 'Sedang Diproses'}</p>
                <hr style="border-color: rgba(255,255,255,0.1); margin: 10px 0;">
                <p><strong>Daftar Item:</strong></p>
                <ul style="padding-left: 18px; font-size: 0.8rem; color: #cbd5e1;">
                    ${itemsListHtml}
                </ul>
                <p style="margin-top: 10px;"><strong>Total Biaya:</strong> <span style="color: #10b981;">Rp ${Number(ord.total).toLocaleString('id-ID')}</span></p>
            `;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editProductId').value;
            let videoInput = document.getElementById('ytVideoUrl').value;
            videoInput = formatYouTubeEmbedUrl(videoInput);

            const productData = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById('nama').value,
                harga: Number(document.getElementById('harga').value),
                metodeBayar: document.getElementById('metodePembayaranDefault').value,
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || 'https://via.placeholder.com/300',
                ytVideo: videoInput
            };

            if (editId) {
                const index = products.findIndex(p => p.id === Number(editId));
                if (index !== -1) {
                    products[index] = productData;
                    alert('Produk berhasil diperbarui!');
                }
            } else {
                products.push(productData);
                alert('Produk baru berhasil ditambahkan!');
            }

            renderAdminProducts();
            resetForm();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('editProductId').value = prod.id;
            document.getElementById('nama').value = prod.nama;
            document.getElementById('harga').value = prod.harga;
            document.getElementById('metodePembayaranDefault').value = prod.metodeBayar || 'Transfer Bank';
            document.getElementById('deskripsi').value = prod.deskripsi;
            document.getElementById('gambarUrl').value = prod.gambar;
            document.getElementById('ytVideoUrl').value = prod.ytVideo;

            document.getElementById('formTitle').innerText = '✏️ Edit Produk';
            document.getElementById('btnSubmit').innerText = 'Update Produk';
            document.getElementById('btnCancel').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('gambarFile').value = '';
            document.getElementById('ytVideoFile').value = '';
            document.getElementById('formTitle').innerText = '➕ Tambah Produk Baru';
            document.getElementById('btnSubmit').innerText = 'Simpan Produk';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(index) {
            if(confirm('Yakin ingin menghapus produk ini?')) {
                products.splice(index, 1);
                renderAdminProducts();
            }
        }

        // Event listener jika ada perubahan data pesanan dari tab customer
        window.addEventListener('storage', function(e) {
            if (e.key === 'gadgetOrders') {
                renderAdminOrders();
            }
        });

        renderAdminProducts();
        renderAdminOrders();
    </script>
</body>
</html>
