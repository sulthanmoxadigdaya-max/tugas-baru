<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding: 15px;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-exit {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #2563eb;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .order-item {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .order-detail {
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #334155;
        }

        .status-select {
            margin-top: 8px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            width: 100%;
            background: white;
        }

        /* MEDIA QUERIES MOBILE ADAPTATION */
        @media (min-width: 900px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚙️ Admin Dashboard - GadgetStore</h1>
        <button class="btn-exit" onclick="window.location.href='index.html'">Keluar Admin</button>
    </header>

    <div class="admin-grid">
        <div class="card">
            <h2>📦 Kelola Pesanan & Pengiriman Masuk</h2>
            <div id="adminOrdersList"></div>
        </div>
    </div>

    <script>
        function renderAdminOrders() {
            const container = document.getElementById('adminOrdersList');
            container.innerHTML = '';

            const orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

            if (orders.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center;">Belum ada pesanan masuk dari pembeli.</p>';
                return;
            }

            orders.forEach((ord, index) => {
                const itemsText = ord.items.map(i => `${i.nama} (${i.qty}x)`).join(', ');
                const pMethod = ord.paymentMethod || 'Bayar di Tempat (COD)';
                const rName = ord.recipientName || ord.buyerName;
                const loc = ord.location || 'Tidak dicantumkan';

                const div = document.createElement('div');
                div.className = 'order-item';
                div.innerHTML = `
                    <div class="order-header">
                        <span>Order #${ord.id} (${ord.date})</span>
                        <span style="color:#2563eb;">Rp ${Number(ord.total).toLocaleString('id-ID')}</span>
                    </div>
                    <div class="order-detail">👤 <strong>Akun Pembeli:</strong> ${ord.buyerName}</div>
                    <div class="order-detail">📦 <strong>Nama Penerima:</strong> ${rName}</div>
                    <div class="order-detail">📍 <strong>Alamat Pengiriman:</strong> ${loc}</div>
                    <div class="order-detail">🛍️ <strong>Item:</strong> ${itemsText}</div>
                    <div class="order-detail">💳 <strong>Metode Pembayaran:</strong> ${pMethod}</div>
                    
                    <div style="margin-top: 10px;">
                        <label style="font-size:0.8rem; font-weight:bold;">Ubah Status Pesanan:</label>
                        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Sedang Diproses</option>
                            <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Dalam Perjalanan</option>
                            <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sudah Sampai</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>🎉 Selesai</option>
                        </select>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateOrderStatus(index, newStatus) {
            const orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];
            orders[index].status = newStatus;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert(`Status Pesanan #${orders[index].id} diperbarui menjadi: ${newStatus}`);
            renderAdminOrders();
        }

        renderAdminOrders();
    </script>
</body>
</html>
